name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test

  server:
    # Builds the production image (this is what compiles the C++ server) and
    # smoke-tests it, so build errors show up here instead of on Render.
    name: Docker image build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t swaralaya .
      - name: Start server
        run: docker run -d --name app -p 3000:3000 swaralaya
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 2
          done
          exit 1
      - name: Smoke test
        run: bash tests/smoke.sh http://localhost:3000
      - name: Server logs
        if: always()
        run: docker logs app
